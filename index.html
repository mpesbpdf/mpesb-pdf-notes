
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPESB PDF Notes | Exam Study Store</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172337}
header{background:#102b50;color:white;padding:18px;text-align:center}
header h2{margin:0}
.hero{background:linear-gradient(120deg,#102b50,#2369ad);color:white;padding:40px 18px;text-align:center}
.hero h1{margin:0 0 10px}
.search{width:90%;max-width:500px;padding:13px;border:0;border-radius:8px;margin-top:15px}
.wrap{max-width:1100px;margin:auto;padding:20px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.filters button,.admin button{padding:10px 15px;border:0;border-radius:7px;background:#1d5fa7;color:white;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:white;border:1px solid #ddd;border-radius:12px;padding:18px}
.tag{display:inline-block;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:bold}
.free{background:#d9f7e8;color:#087443}
.paid{background:#fff0d5;color:#985500}
.price{font-size:22px;font-weight:bold;margin:12px 0}
.card button{width:100%;padding:11px;border:0;border-radius:7px;background:#1d5fa7;color:white;cursor:pointer}
.admin{background:white;padding:20px;border-radius:12px;margin-top:30px}
.admin input,.admin select{width:100%;padding:11px;margin:7px 0 13px;border:1px solid #ccc;border-radius:7px}
footer{text-align:center;padding:25px;color:#666}
</style>
</head>
<body>

<header>
<h2>MPESB PDF NOTES</h2>
<p>आपकी परीक्षा की तैयारी, अब आसान</p>
</header>

<section class="hero">
<h1>Exam Study PDF Store</h1>
<p>MPESB | Banking | Computer | SSC</p>
<input class="search" id="search" placeholder="PDF खोजें..." oninput="render()">
</section>

<main class="wrap">
<h2>PDF Categories</h2>
<div class="filters">
<button onclick="setCategory('All')">All</button>
<button onclick="setCategory('MPESB')">MPESB</button>
<button onclick="setCategory('Banking')">Banking</button>
<button onclick="setCategory('Computer')">Computer</button>
<button onclick="setCategory('SSC')">SSC</button>
</div>

<h2>Available PDF Notes</h2>
<div class="grid" id="productGrid"></div>

<section class="admin">
<h2>Admin - Add PDF (Demo)</h2>
<p>यह डेमो सुविधा केवल इसी ब्राउज़र के खुले पेज में काम करेगी।</p>

<form id="uploadForm">
<label>PDF का नाम</label>
<input id="pname" required placeholder="PDF का नाम लिखें">

<label>Category</label>
<select id="pcat">
<option>MPESB</option>
<option>Banking</option>
<option>Computer</option>
<option>SSC</option>
<option>Other</option>
</select>

<label>PDF का प्रकार</label>
<select id="ptype">
<option value="FREE">FREE</option>
<option value="PAID">PAID</option>
</select>

<label>कीमत (₹)</label>
<input id="pprice" type="number" min="0" value="0">

<label>PDF File</label>
<input id="pfile" type="file" accept="application/pdf" required>

<button type="submit">Add PDF</button>
</form>
</section>
</main>

<footer>
<p>© 2026 MPESB PDF Notes | All Rights Reserved</p>
</footer>

<script>
let products=[
{name:"MPESB Maths Practice Set",cat:"MPESB",type:"FREE",price:0,file:null},
{name:"Computer Fundamentals MCQ Set",cat:"Computer",type:"PAID",price:49,file:null},
{name:"Banking Maths Practice Set",cat:"Banking",type:"PAID",price:79,file:null},
{name:"SSC Reasoning Notes",cat:"SSC",type:"FREE",price:0,file:null}
];

let selectedCategory="All";

function setCategory(category){
selectedCategory=category;
render();
}

function render(){
let q=document.getElementById("search").value.toLowerCase();

let list=products.filter(p=>
(selectedCategory==="All"||p.cat===selectedCategory)&&
p.name.toLowerCase().includes(q)
);

let grid=document.getElementById("productGrid");
grid.innerHTML="";

if(!list.length){
grid.innerHTML="<p>कोई PDF नहीं मिली।</p>";
return;
}

list.forEach(p=>{
let card=document.createElement("div");
card.className="card";

let title=document.createElement("h3");
title.textContent=p.name;

let category=document.createElement("p");
category.textContent=p.cat;

let tag=document.createElement("span");
tag.className="tag "+(p.type==="FREE"?"free":"paid");
tag.textContent=p.type;

let price=document.createElement("div");
price.className="price";
price.textContent=p.type==="FREE"?"FREE":"₹"+p.price;

let button=document.createElement("button");
button.textContent=p.type==="FREE"?"Download PDF":"Buy Now";

button.onclick=()=>{
if(p.type==="FREE"){
if(p.file){
let url=URL.createObjectURL(p.file);
let a=document.createElement("a");
a.href=url;
a.download=p.name+".pdf";
a.click();
setTimeout(()=>URL.revokeObjectURL(url),1000);
}else{
alert("इस PDF की फाइल अभी अपलोड नहीं की गई है।");
}
}else{
alert("यह केवल Demo Buy Now बटन है। असली भुगतान और सुरक्षित डाउनलोड अभी जुड़े नहीं हैं।");
}
};

card.append(title,category,tag,price,button);
grid.appendChild(card);
});
}

document.getElementById("uploadForm").addEventListener("submit",function(e){
e.preventDefault();

let file=document.getElementById("pfile").files[0];
let name=document.getElementById("pname").value.trim();
let cat=document.getElementById("pcat").value;
let type=document.getElementById("ptype").value;
let price=Number(document.getElementById("pprice").value);

if(!file||file.type!=="application/pdf"){
alert("कृपया सही PDF फाइल चुनें।");
return;
}

if(type==="PAID"&&price<=0){
alert("Paid PDF की कीमत डालें।");
return;
}

products.push({name,cat,type,price,file});
render();
this.reset();
alert("PDF Demo में जोड़ दी गई है।");
});

render();
</script>
</body>
</html>
